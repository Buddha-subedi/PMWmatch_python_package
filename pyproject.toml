[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "pmwmatch"
version = "0.2.1"
description = "PMW to DPR and MRMS swath collocation with pixel time screening"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "h5py>=3.8", "xarray>=2023.1", "matplotlib>=3.7", "requests>=2.28", "pyyaml>=6", "netCDF4>=1.6"]
[project.optional-dependencies]
maps = ["cartopy>=0.22"]
notebook = ["ipython>=8"]
mrms = ["cfgrib>=0.9.10", "eccodes>=1.6"]
test = ["pytest>=7"]
[project.scripts]
pmwmatch = "pmwmatch.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
